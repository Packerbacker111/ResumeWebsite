name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Optimize portrait
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/optimize_portrait.py
      - name: Test site
        run: |
          python tools/blog.py build --output .blog-build
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Stage public files only
        run: |
          mkdir -p _site/content _site/public _site/.well-known _site/blog
          cp index.html work.html rpm.html cookie-challenge.html favicon.ico robots.txt sitemap.xml style.css response-lab.css theme.js script.js lab-model.js response-lab.js cookie-challenge.js staticwebapp.config.json _site/
          cp .blog-build/*.html blog/editor.html blog/post.html blog/*.js _site/blog/
          cp -R images _site/images
          rm _site/images/pfp3.jpg
          cp content/SRegelbruggeResume.pdf _site/content/
          cp public/og.png _site/public/
          cp public/rpm-preview.html public/rpm-preview.css public/rpm-preview.js _site/public/
          cp .well-known/discord _site/.well-known/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_TREE_00EAE9110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "_site"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_TREE_00EAE9110 }}
          action: "close"
